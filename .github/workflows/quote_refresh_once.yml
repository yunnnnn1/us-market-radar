name: Safe quote refresh once

# Manual one-pass refresh. It does not replace the scheduled 24-7 engine.
# Notifications, Discord, PushPlus, WeChat, email, and AI web calls stay off.
on:
  workflow_dispatch:

concurrency:
  group: us-market-radar-safe-once
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-once:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 安装量化与数据分析依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 单次抓取行情并写看板（不发任何通知）
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RADAR_DISABLE_EXTERNAL_ALERTS: "1"
          AI_WEB_AUTO_BRIEF_ENABLED: "0"
        run: |
          python integrated_market_radar.py --once --no-alerts --no-browser

      - name: 提交本轮生成文件
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add \
            index.html \
            futu_pro_terminal.html \
            macro_radar.html \
            stocks_radar.html \
            predict_radar_5y.html \
            data_cache/latest_ai_predictions.json \
            data_cache/latest_radar_snapshot.json \
            data_cache/latest_market_news.json \
            data_cache/intraday_path_forecasts.json \
            data_cache/live_prediction_scorecard.json \
            data_cache/shared_alert_dedupe.json \
            .terminal_notifications.json
          if git diff --cached --quiet; then
            echo "no generated changes"
            exit 0
          fi
          STAMP=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d %H:%M:%S ET'))")
          git commit -m "Refresh quotes once without notifications ($STAMP)"
          git push origin HEAD:main

      - name: 请求本仓库 Pages 重新构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" > /tmp/pages-build.json
          python -c "import json; d=json.load(open('/tmp/pages-build.json')); print('pages_build', d.get('status'))"
