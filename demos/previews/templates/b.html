<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设计预览 B · 均衡三栏</title>
<style>
__SHARED_CSS__
</style>
</head>
<body data-layout="b">
  <div class="banner">设计预览 B · 均衡三栏 · 未连接行情 · 不能下单 · 数值来自仓库快照</div>
  <header class="topbar">
    <div class="brand">
      <span class="pill">B</span>
      <div>
        <strong>均衡三栏</strong>
        <div class="brand-sub">列表、K 线、详情同时在，次要内容默认收起</div>
      </div>
    </div>
    <nav id="stepper" aria-label="看盘路径"></nav>
    <div class="top-side">
      <div id="topMeta"></div>
      <button id="btnCollapse" type="button">收起列表</button>
    </div>
  </header>
  <div class="desk">
    <aside class="watch" id="watch">
      <div class="watch-tools">
        <input id="search" type="search" placeholder="搜索代码或名称" aria-label="搜索标的">
        <div id="filters" class="segbar"></div>
      </div>
      <div id="watchList" class="watch-list"></div>
    </aside>
    <section class="stage">
      <div id="quoteHost"></div>
      <div class="chart-toolbar">
        <div id="periods" class="segbar"></div>
        <div id="indis" class="segbar"></div>
        <div id="ohlcReadout" class="ohlc"></div>
      </div>
      <div class="chart-frame">
        <canvas id="chart" aria-label="离线K线"></canvas>
        <div id="chartEmpty" class="chart-empty" hidden></div>
      </div>
      <div id="chartNote" class="chart-note"></div>
    </section>
    <aside class="rail" id="rail">
      <section class="acc open" data-acc="essentials">
        <button class="acc-btn" type="button" data-act="acc" data-acc="essentials">
          <span class="acc-title">要点</span>
          <span class="acc-sum" id="sum-essentials"></span>
        </button>
        <div class="acc-body" id="essentialsHost"></div>
      </section>
      <section class="acc" data-acc="market">
        <button class="acc-btn" type="button" data-act="acc" data-acc="market">
          <span class="acc-title">市场</span>
          <span class="acc-sum" id="sum-market"></span>
        </button>
        <div class="acc-body" id="marketHost"></div>
      </section>
      <section class="acc" data-acc="sector">
        <button class="acc-btn" type="button" data-act="acc" data-acc="sector">
          <span class="acc-title">板块</span>
          <span class="acc-sum" id="sum-sector"></span>
        </button>
        <div class="acc-body" id="sectorHost"></div>
      </section>
      <section class="acc" data-acc="ai">
        <button class="acc-btn" type="button" data-act="acc" data-acc="ai">
          <span class="acc-title">AI 波段</span>
          <span class="acc-sum" id="sum-ai"></span>
        </button>
        <div class="acc-body" id="aiHost"></div>
      </section>
      <section class="acc" data-acc="options">
        <button class="acc-btn" type="button" data-act="acc" data-acc="options">
          <span class="acc-title">期权</span>
          <span class="acc-sum" id="sum-options"></span>
        </button>
        <div class="acc-body" id="optionsHost"></div>
      </section>
      <section class="acc" data-acc="tactics">
        <button class="acc-btn" type="button" data-act="acc" data-acc="tactics">
          <span class="acc-title">参考价位</span>
          <span class="acc-sum" id="sum-tactics"></span>
        </button>
        <div class="acc-body" id="tacticsHost"></div>
      </section>
    </aside>
  </div>
  <footer id="footnote" class="footnote"></footer>
<script>
__SHARED_JS__
</script>
</body>
</html>
